
name: React CI

on:
  push: # on commit pushed to github
  pull_request: # whenever a new pull request is opened

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest # Runner in github action.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
