
name: React CI

on:
  push: # on commit pushed to github
  pull_request: # whenever a new pull request is opened

permissions:
  contents: read

jobs:
  dummy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  quality-check:
    runs-on: ubuntu-latest # Runner in github action.
    defaults:
      run:
        working-directory: tetris

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tetris/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
